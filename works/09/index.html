<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>봉사단체 소개 및 후원 (데모)</title>
<meta name="description" content="봉사단체 소개와 정기·일시 후원 안내">
<meta name="robots" content="noindex">
<style>
/* ===== 디자인 기준 (디자인.md 참고). 색을 바꾸려면 여기만 수정 ===== */
:root {
  --primary: #0077d4;
  --primary-dark: #005fa9;
  --navy: #0e4280;
  --blue: #115a9e;
  --purple: #6b3a8c;
  --steel: #3e6b8a;
  --text: #212121;
  --muted: #5f6b73;
  --surface: #f1f4f6;
  --border: #d5dadd;
  --bg: #ffffff;
  --radius: 8px;
  --pill: 24px;
  --max: 1200px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: "Pretendard", "Inter", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 16px; background: var(--bg); color: var(--text);
  line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere;
}
img { max-width: 100%; display: block; }
a { color: var(--primary); }
.container { max-width: var(--max); margin: 0 auto; padding: 0 24px; }
@media (max-width: 760px) { .container { padding: 0 16px; } }
[hidden] { display: none !important; }

/* 맨 위 안내 띠 */
.example-notice { background: var(--navy); color: #fff; text-align: center; font-size: 0.9rem; font-weight: 600; padding: 12px 16px; }

/* 머리글 */
.site-header { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid var(--border); }
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; position: relative; }
.logo { font-weight: 800; font-size: 1.3rem; text-decoration: none; color: var(--primary); letter-spacing: -0.01em; }
.logo img { height: 40px; }
.nav { display: flex; gap: 8px; align-items: center; }
.nav a { text-decoration: none; padding: 8px 12px; color: var(--text); font-weight: 600; font-size: 0.95rem; border-bottom: 2px solid transparent; }
.nav a:hover { color: var(--primary); }
.nav a.active { color: var(--primary); border-bottom-color: var(--primary); }
.nav a.nav-cta { color: #fff; background: var(--primary); border-radius: var(--pill); padding: 10px 20px; margin-left: 8px; border-bottom: 0; }
.nav a.nav-cta:hover, .nav a.nav-cta.active { background: var(--primary-dark); color: #fff; }
.menu-toggle { display: none; background: none; border: 0; font-size: 1.6rem; cursor: pointer; color: var(--text); padding: 4px 8px; }
@media (max-width: 760px) {
  .menu-toggle { display: block; }
  .nav { display: none; position: absolute; top: 72px; left: 0; right: 0; flex-direction: column; align-items: stretch; padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--border); }
  .nav.open { display: flex; }
  .nav a.nav-cta { margin: 8px 0 0; text-align: center; }
}

/* 버튼: 알약 모양 + 화살표 */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: var(--pill); background: var(--primary); color: #fff; font-weight: 600; font-size: 0.875rem; text-decoration: none; border: 1px solid var(--primary); cursor: pointer; font-family: inherit; line-height: 1.4; }
.btn:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
.btn .arrow { transition: transform .15s; }
.btn:hover .arrow { transform: translateX(3px); }
.btn.outline { background: transparent; color: var(--primary); }
.btn.outline:hover { background: rgba(0, 119, 212, 0.08); }
.btn.white { background: #fff; color: var(--primary); border-color: #fff; }
.btn.white:hover { background: #e8f2fb; }
.btn:disabled { opacity: 0.6; cursor: default; }

/* 공통 */
section { padding: 64px 0; }
.divider { border: 0; border-top: 1px solid var(--border); margin: 0; }
.section-title { font-size: clamp(1.6rem, 3vw, 2.125rem); font-weight: 700; line-height: 1.17; margin: 0 0 12px; letter-spacing: -0.01em; }
.section-lead { font-size: 1.125rem; line-height: 1.6; margin: 0 0 32px; max-width: 760px; }
.page-head { padding: 56px 0 8px; }
.page-head h1 { font-size: clamp(2rem, 4vw, 2.75rem); font-weight: 800; line-height: 1.17; margin: 0 0 12px; letter-spacing: -0.02em; }
.page-head p { font-size: 1.125rem; margin: 0; max-width: 760px; }
.grid { display: grid; gap: 24px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.card { background: var(--surface); border-radius: var(--radius); padding: 24px; }
.card h3 { font-size: 1.125rem; font-weight: 600; margin: 0 0 8px; }
.card p { margin: 0; color: var(--muted); }
.caption { font-size: 0.8125rem; color: var(--muted); margin-top: 8px; }

/* 예시 이미지 자리 */
.placeholder {
  width: 100%; height: 100%; min-height: 120px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background: repeating-linear-gradient(45deg, #e7ecef, #e7ecef 12px, var(--surface) 12px, var(--surface) 24px);
  color: var(--muted); font-size: 0.85rem; font-weight: 600; text-align: center;
}
.placeholder .ph-icon { font-size: 1.8rem; opacity: 0.6; }

/* 첫 화면 */
.hero { padding: 96px 0; min-height: 520px; background-size: cover; background-position: center; position: relative; overflow: hidden; }
/* 계절별 하늘색과 땅색 */
.hero[data-season="spring"] { background-image: linear-gradient(180deg, #fde6ee 0%, #fff7f2 75%, #e4f1d6 100%); }
.hero[data-season="summer"] { background-image: linear-gradient(180deg, #d9effa 0%, #f3fbf6 75%, #cfe8bd 100%); }
.hero[data-season="autumn"] { background-image: linear-gradient(180deg, #fde2c4 0%, #fff4e6 75%, #f0dcb8 100%); }
.hero[data-season="winter"] { background-image: linear-gradient(180deg, #c9d7e8 0%, #e6eef7 75%, #f4f8fc 100%); }
.hero[data-season="spring"] .ground { fill: #d5eabf; }
.hero[data-season="summer"] .ground { fill: #a9d18e; }
.hero[data-season="autumn"] .ground { fill: #e4c48f; }
.hero[data-season="winter"] .ground { fill: #fbfdff; stroke: #c9d6e3; stroke-width: 2; }
.hero-art { position: absolute; right: 0; bottom: 0; width: min(56%, 700px); height: auto; pointer-events: none;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 16%); mask-image: linear-gradient(to right, transparent 0, #000 16%); }
.hero-art .s-spring, .hero-art .s-summer, .hero-art .s-autumn, .hero-art .s-winter { display: none; }
.hero[data-season="spring"] .s-spring, .hero[data-season="summer"] .s-summer,
.hero[data-season="autumn"] .s-autumn, .hero[data-season="winter"] .s-winter { display: inline; }
.hero-label { position: absolute; right: 12px; bottom: 10px; font-size: 0.75rem; color: var(--muted); background: rgba(255,255,255,0.85); padding: 2px 10px; border-radius: var(--pill); }
.hero.has-image { color: #fff; }
.hero.has-image::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,0.6), rgba(0,0,0,0.2)); }
.hero .container { position: relative; }
.hero h1 { font-size: clamp(2.1rem, 5vw, 3.75rem); font-weight: 800; line-height: 1.17; letter-spacing: -0.02em; margin: 0 0 20px; white-space: pre-line; max-width: 640px; }
.hero p { font-size: 1.125rem; margin: 0 0 32px; max-width: 520px; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.hero.has-image .btn.outline { color: #fff; border-color: #fff; }
@media (max-width: 760px) {
  .hero { padding: 56px 0 0; min-height: 0; }
  .hero-art { position: static; display: block; width: 100%; margin-top: 16px; -webkit-mask-image: none; mask-image: none; }
}

/* 성과 숫자 타일 */
.stat-tile { background: var(--navy); color: #fff; border-radius: var(--radius); padding: 24px; min-height: 140px; display: flex; flex-direction: column; justify-content: flex-end; }
.stat-tile:nth-child(2) { background: var(--blue); }
.stat-tile:nth-child(3) { background: var(--steel); }
.stat-tile:nth-child(4) { background: var(--purple); }
.stat-number { font-size: clamp(2.2rem, 4vw, 3rem); font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; }
.stat-number small { font-size: 1rem; font-weight: 600; margin-left: 4px; }
.stat-label { font-weight: 600; opacity: 0.9; margin-top: 4px; }
@media (max-width: 760px) {
  .stats-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-tile { min-height: 112px; padding: 16px; }
}

/* 글 + 사진 나란히 */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
.split .media { border-radius: var(--radius); overflow: hidden; aspect-ratio: 4 / 3; }
.split .media img { width: 100%; height: 100%; object-fit: cover; }
@media (max-width: 760px) { .split { grid-template-columns: 1fr; gap: 24px; } }

/* 색 타일 (주요 활동) */
.tile { position: relative; display: flex; flex-direction: column; justify-content: flex-start; min-height: 220px; padding: 24px; border-radius: var(--radius); color: #fff; text-decoration: none; background: var(--blue); }
.tile:nth-child(3n+2) { background: var(--purple); }
.tile:nth-child(3n+3) { background: var(--steel); }
.tile h3 { font-size: 1.125rem; font-weight: 600; margin: 0 40px 12px 0; }
.tile p { margin: 0; color: rgba(255,255,255,0.92); }
.tile .tile-icon { font-size: 1.8rem; margin-top: auto; padding-top: 24px; }
.tile .circle-arrow { position: absolute; top: 20px; right: 20px; width: 28px; height: 28px; border-radius: 50%; background: #fff; color: var(--text); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; transition: transform .15s; }
.tile:hover .circle-arrow { transform: translateX(3px); }

/* 후원 유도 띠 */
.cta-band { background: var(--primary); color: #fff; }
.cta-band .container { display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.cta-band h2 { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; margin: 0 0 8px; }
.cta-band p { margin: 0; opacity: 0.92; max-width: 640px; }

/* 단체 소개 */
.mission { font-size: clamp(1.4rem, 3vw, 1.75rem); font-weight: 700; line-height: 1.35; color: var(--primary); margin: 0; }
.vision-list { padding: 0; margin: 0; list-style: none; display: grid; gap: 12px; }
.vision-list li { background: var(--surface); border-left: 4px solid var(--primary); padding: 14px 18px; border-radius: 0 var(--radius) var(--radius) 0; }
.timeline { list-style: none; padding: 0; margin: 24px 0 0 6px; border-left: 2px solid var(--border); }
.timeline li { position: relative; padding: 0 0 22px 26px; }
.timeline li::before { content: ""; position: absolute; left: -7px; top: 8px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); }
.timeline .year { font-weight: 800; color: var(--primary); margin-right: 12px; }
.person { text-align: center; }
.avatar { width: 112px; height: 112px; border-radius: 50%; margin: 0 auto 12px; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar .placeholder { min-height: 0; font-size: 0.75rem; }
.person .role { color: var(--muted); font-size: 0.95rem; }

/* 활동 소식 */
.news-card { display: flex; flex-direction: column; color: inherit; text-decoration: none; }
.news-card:hover h3 { color: var(--primary); text-decoration: underline; }
.news-thumb { aspect-ratio: 16 / 10; border-radius: var(--radius); overflow: hidden; position: relative; }
.photo-count { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,0.65); color: #fff; font-size: 0.8125rem; font-weight: 600; padding: 3px 10px; border-radius: var(--pill); }
.back-link { margin: 0 0 16px; font-weight: 600; }
.back-link a { text-decoration: none; }
.news-text { font-size: 1.0625rem; line-height: 1.8; white-space: pre-line; margin-bottom: 32px; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.photo-grid a { display: block; aspect-ratio: 4 / 3; border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.photo-grid img { width: 100%; height: 100%; object-fit: cover; transition: transform .2s; }
.photo-grid a:hover img { transform: scale(1.03); }
.news-thumb img { width: 100%; height: 100%; object-fit: cover; }
.news-body { padding: 16px 0 0; }
.news-body h3 { font-size: 1.125rem; font-weight: 600; line-height: 1.4; margin: 8px 0 6px; }
.news-body p { margin: 0; color: var(--muted); }
.news-meta { font-size: 0.8125rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tag { color: var(--primary); font-weight: 700; text-transform: uppercase; }
.filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
.filter-bar button { border: 1px solid var(--border); background: #fff; padding: 8px 18px; border-radius: var(--pill); cursor: pointer; font-family: inherit; font-size: 0.875rem; font-weight: 600; color: var(--text); }
.filter-bar button:hover { border-color: var(--primary); color: var(--primary); }
.filter-bar button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.empty { color: var(--muted); text-align: center; padding: 40px 0; }

/* 후원 */
.amount { font-size: 1.75rem; font-weight: 800; color: var(--primary); letter-spacing: -0.01em; }
.bank-box { background: var(--surface); border-radius: var(--radius); padding: 32px 24px; text-align: center; border-top: 4px solid var(--primary); }
.bank-box .account { font-size: clamp(1.4rem, 3vw, 1.75rem); font-weight: 800; margin: 8px 0; letter-spacing: 0.02em; }
.notice { font-size: 0.95rem; color: var(--muted); background: var(--surface); padding: 16px 20px; border-radius: var(--radius); margin-top: 20px; }
.form { display: grid; gap: 20px; }
.form .field > label, .form .field > .label { font-weight: 600; display: block; margin-bottom: 6px; }
.req { color: #c62828; }
.form input[type="text"], .form input[type="tel"], .form input[type="email"], .form select, .form textarea {
  width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 1rem; font-family: inherit; background: #fff; color: var(--text);
}
.form input:focus, .form select:focus, .form textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }
.radio-row { display: flex; gap: 18px; flex-wrap: wrap; }
.radio-row label { display: flex; gap: 6px; align-items: center; }
.consent { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; font-size: 0.92rem; }
.consent .table-wrap { overflow-x: auto; }
.consent table { width: 100%; border-collapse: collapse; margin: 8px 0 12px; }
.consent th, .consent td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
.consent th { background: var(--surface); width: 32%; }
.consent .check { font-weight: 600; display: flex; gap: 8px; align-items: center; }
.field-error { color: #c62828; font-size: 0.9rem; margin-top: 4px; }
.form-result { padding: 20px; border-radius: var(--radius); text-align: center; font-weight: 600; }
.form-result.ok { background: #e3f1fc; color: var(--navy); }
.form-result.warn { background: #fff4e5; color: #8a4b00; }

/* 개인정보처리방침 */
.policy h2 { font-size: 1.125rem; font-weight: 700; margin-top: 32px; }
.policy table { border-collapse: collapse; width: 100%; }
.policy th, .policy td { border: 1px solid var(--border); padding: 8px; text-align: left; vertical-align: top; }
.policy th { background: var(--surface); }

/* 바닥글 */
.site-footer { background: var(--surface); color: var(--text); padding: 48px 0; font-size: 0.92rem; border-top: 1px solid var(--border); }
.site-footer strong { font-size: 1.05rem; }
.site-footer p { margin: 4px 0; color: var(--muted); }
.site-footer a { color: var(--text); }
.footer-links { margin-top: 16px; display: flex; gap: 20px; flex-wrap: wrap; }
.footer-links a { font-weight: 600; text-decoration: none; }
.footer-links a:hover { color: var(--primary); }

/* 데모 표시 (화면 왼쪽 아래) */
.demo-badge { position: fixed; left: 12px; bottom: 12px; z-index: 50; display: flex; align-items: center; gap: 8px; background: rgba(33,33,33,0.86); color: #fff; font-size: 0.75rem; font-weight: 600; padding: 6px 8px 6px 12px; border-radius: var(--pill); box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
.demo-badge a, .demo-badge button { color: #fff; background: rgba(255,255,255,0.16); border: 0; border-radius: var(--pill); padding: 3px 10px; font: inherit; cursor: pointer; text-decoration: none; }
.demo-badge a:hover, .demo-badge button:hover { background: rgba(255,255,255,0.3); }
.demo-note { font-size: 0.875rem; color: #8a4b00; background: #fff4e5; padding: 10px 14px; border-radius: var(--radius); margin: 0; }
.toast { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 60; background: var(--navy); color: #fff; padding: 12px 20px; border-radius: var(--radius); font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,0.2); max-width: calc(100% - 32px); text-align: center; }

/* 관리자 화면 (데모) */
.admin-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 24px; }
.admin-bar .who { font-weight: 600; }
.admin-bar .who small { display: block; color: var(--muted); font-weight: 400; }
.admin-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.editor details { border: 1px solid var(--border); border-radius: var(--radius); background: #fff; margin-bottom: 12px; }
.editor details > summary { cursor: pointer; padding: 12px 16px; font-weight: 700; list-style-position: inside; }
.editor details[open] > summary { border-bottom: 1px solid var(--border); }
.editor .ed-body { padding: 16px; display: grid; gap: 16px; }
.editor .ed-field > label, .editor .ed-field > .ed-label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
.editor .ed-hint { font-size: 0.8125rem; color: var(--muted); margin-top: 4px; }
.editor input[type="text"], .editor textarea, .editor select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 1rem; font-family: inherit; background: #fff; color: var(--text); }
.editor textarea { min-height: 84px; resize: vertical; }
.editor .ed-check { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.editor .ed-item > summary { font-weight: 600; }
.editor .ed-item-tools { display: flex; gap: 6px; justify-content: flex-end; }
.editor .ed-item-tools button, .editor .ed-small { border: 1px solid var(--border); background: #fff; border-radius: var(--pill); padding: 4px 12px; cursor: pointer; font-family: inherit; font-size: 0.8125rem; color: var(--text); }
.editor .ed-item-tools button:hover, .editor .ed-small:hover { border-color: var(--primary); color: var(--primary); }
.editor .ed-item-tools button.danger:hover { border-color: #c62828; color: #c62828; }
.editor .ed-img { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.editor .ed-img .thumb { width: 96px; height: 72px; border-radius: 6px; overflow: hidden; background: var(--surface); flex: none; }
.editor .ed-img .thumb img { width: 100%; height: 100%; object-fit: cover; }
.editor .ed-img .thumb .placeholder { min-height: 0; font-size: 0.7rem; }
.demo-badge { white-space: nowrap; }
@media (max-width: 760px) {
  .demo-badge { left: 8px; bottom: 8px; font-size: 0.6875rem; gap: 6px; padding: 4px 6px 4px 10px; }
  .demo-badge a { display: none; } /* 좁은 화면에서는 바닥글의 "관리자 화면 (데모)" 링크를 씁니다 */
}
</style>
</head>
<body>
  <div id="example-notice" class="example-notice" hidden>
    숫자, 연혁, 사진, 소식, 연락처 등 일부 내용은 아직 <strong>예시</strong>입니다. 실제 정보로 바꾼 뒤 공개해 주세요.
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="#home" id="logo"></a>
      <button class="menu-toggle" id="menu-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button>
      <nav class="nav" id="nav">
        <a href="#home" data-route="home">홈</a>
        <a href="#about" data-route="about">단체 소개</a>
        <a href="#news" data-route="news">활동 소식</a>
        <a href="#donate" data-route="donate" class="nav-cta">후원하기</a>
      </nav>
    </div>
  </header>

  <main id="app"></main>

  <footer class="site-footer">
    <div class="container" id="footer"></div>
  </footer>

  <div class="demo-badge" role="note">
    <span>데모 버전 · 가짜 데이터</span>
    <a href="#admin">관리자 화면</a>
    <button type="button" id="demo-reset">예시 데이터로 초기화</button>
  </div>

<script>
(function () {
  "use strict";

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function placeholder(label) {
    return '<div class="placeholder" role="img" aria-label="예시 이미지"><span class="ph-icon">🖼️</span><span>예시 이미지</span>' +
      (label ? "<span>" + esc(label) + "</span>" : "") + "</div>";
  }

    return src ? '<img src="' + esc(src) + '" alt="' + esc(alt) + '" loading="lazy">' : placeholder(label);
  }

  function button(href, label, style) {

  // 홈 화면의 최근 활동 소식 3개. 관리자가 소식을 올리면 여기에 자동으로 나타납니다.

    var items = sortedNews().slice(0, 3);
    if (!items.length) return "";
    return '<div class="container"><hr class="divider"></div>' +
      '<section><div class="container"><h2 class="section-title">' + esc(T.home.newsTitle) + "</h2>" + lead(T.home.newsLead) +

        '<p style="margin-top:32px">' + button("#news", T.home.newsButton) + "</p></div></section>";
  }

  /* ---------- 활동 소식 ---------- */
  var newsFilter = "전체";
  // 날짜(2026-11-15 형식)가 적힌 소식은 최신순으로, 날짜가 없는 소식은 적힌 순서대로 그 뒤에 놓습니다.
  // 각 항목의 i는 site.json 안의 원래 위치로, 상세 화면 주소(#news/i)에 씁니다.
  function sortedNews() {
    var list = C.news.map(function (n, i) { return { n: n, i: i }; });
    var dated = list.filter(function (x) { return /^\d{4}-\d{2}-\d{2}/.test(x.n.date || ""); });
    var undated = list.filter(function (x) { return dated.indexOf(x) < 0; });
    dated.sort(function (a, b) { return a.n.date < b.n.date ? 1 : a.n.date > b.n.date ? -1 : a.i - b.i; });
    return dated.concat(undated);
  }
  function newsPhotos(n) {
    var all = (n.image ? [n.image] : []).concat(n.photos || []);
    return all.filter(function (src, k) { return src && all.indexOf(src) === k; });
  }
  function newsCard(x) {
    var n = x.n, photos = newsPhotos(n);
    return '<a class="news-card" href="#news/' + x.i + '"><div class="news-thumb">' + image(photos[0], n.title, n.category) +
        (photos.length > 1 ? '<span class="photo-count">사진 ' + photos.length + "장</span>" : "") + "</div>" +
      '<div class="news-body"><div class="news-meta"><span class="tag">' + esc(n.category) + "</span><span>" + esc(n.date) + "</span></div>" +
      "<h3>" + esc(n.title) + "</h3><p>" + esc(n.summary) + "</p></div></a>";
  }
  function newsCards() {
    var items = sortedNews().filter(function (x) { return newsFilter === "전체" || x.n.category === newsFilter; });
    if (!items.length) return '<p class="empty">아직 등록된 소식이 없습니다.</p>';
    return '<div class="grid grid-3">' + items.map(newsCard).join("") + "</div>";
  }
  function renderNewsDetail(i) {
    var n = C.news[i];
    if (!n) return renderNews();
    var photos = newsPhotos(n);
    return (
      '<div class="page-head"><div class="container" style="max-width:960px"><p class="back-link"><a href="#news">← ' + esc(T.news.backButton) + "</a></p>" +
        '<div class="news-meta"><span class="tag">' + esc(n.category) + "</span><span>" + esc(n.date) + "</span></div>" +
        "<h1>" + esc(n.title) + "</h1>" + lead(n.summary, " ") + "</div></div>" +
      '<section style="padding-top:32px"><div class="container" style="max-width:960px">' +
        (n.body ? '<div class="news-text">' + esc(n.body) + "</div>" : "") +
        (photos.length
          ? '<div class="photo-grid">' + photos.map(function (src, k) {

  // 데모의 사진은 data: 주소라 브라우저가 새 탭에서 열어 주지 않으므로, blob: 주소로 바꿔 크게 볼 수 있게 합니다.
  function dataUrlToBlobUrl(url) {
    var comma = url.indexOf(","), meta = url.slice(5, comma), data = url.slice(comma + 1);
    var type = meta.split(";")[0], bytes;
    if (/;base64/.test(meta)) {
      var bin = atob(data); bytes = new Uint8Array(bin.length);
      for (var k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
    } else {
      bytes = decodeURIComponent(data);
    }
    return URL.createObjectURL(new Blob([bytes], { type: type }));
  }
  function bindNewsDetail() {
    Array.prototype.forEach.call(document.querySelectorAll('.photo-grid a[href^="data:"]'), function (a) {
      try { a.href = dataUrlToBlobUrl(a.getAttribute("href")); } catch (e) { /* 그대로 둠 */ }
    });
  }

  }

  function bindDonate() {

    closeMenu();

    if (route.bind && !detail) route.bind();

    var navKey = key === "apply" ? "donate" : (routes[key] ? key : "home");
    Array.prototype.forEach.call(document.querySelectorAll("#nav a"), function (a) {

  var draft = null;          // 게시 전에 고치고 있는 내용

  function clone(v) { return JSON.parse(JSON.stringify(v)); }
  function getAt(obj, path) { return path.reduce(function (o, k) { return o == null ? undefined : o[k]; }, obj); }
  function setAt(obj, path, value) {
    var parent = getAt(obj, path.slice(0, -1));
    parent[path[path.length - 1]] = value;
  }
  function emptyValue(f) {
    if (f.widget === "list") return [];
    if (f.widget === "boolean") return false;
    if (f.widget === "object") { var o = {}; f.fields.forEach(function (sub) { o[sub.name] = emptyValue(sub); }); return o; }
    if (f.widget === "select") return f.options[0][0];
    return "";
  }
  function itemSummary(f, item, i) {
    if (!f.fields) return item || "(빈 항목)";
    var text = (f.summary || "").replace(/\{\{(\w+)\}\}/g, function (m, k) { return item[k] == null ? "" : item[k]; }).trim();
    return text || "항목 " + (i + 1);
  }
  function hint(f) { return f.hint ? '<div class="ed-hint">' + esc(f.hint) + "</div>" : ""; }
  function details(path, label, body, cls) {
    var key = path.join(".");
    return '<details class="' + (cls || "") + '" data-open-key="' + esc(key) + '"' + (openPaths[key] ? " open" : "") + "><summary>" + esc(label) +
      '</summary><div class="ed-body">' + body + "</div></details>";
  }
  function fieldHtml(f, value, path) {
    var p = esc(path.join(".")), id = "ed-" + path.join("-");
    switch (f.widget) {
      case "boolean":
        return '<div class="ed-field"><label class="ed-check"><input type="checkbox" data-path="' + p + '"' + (value ? " checked" : "") + "> " + esc(f.label) + "</label>" + hint(f) + "</div>";
      case "text":
        return '<div class="ed-field"><label for="' + id + '">' + esc(f.label) + '</label><textarea id="' + id + '" data-path="' + p + '">' + esc(value) + "</textarea>" + hint(f) + "</div>";
      case "select":
        return '<div class="ed-field"><label for="' + id + '">' + esc(f.label) + '</label><select id="' + id + '" data-path="' + p + '">' +
          f.options.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === value ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join("") + "</select>" + hint(f) + "</div>";
      case "image":
        return '<div class="ed-field"><span class="ed-label">' + esc(f.label) + '</span><div class="ed-img"><div class="thumb">' + image(value, f.label, "") + "</div>" +
          '<label class="ed-small">이미지 선택<input type="file" accept="image/*" data-img-path="' + p + '" hidden></label>' +
          (value ? '<button type="button" class="ed-small" data-act="clear" data-path="' + p + '">이미지 빼기</button>' : "") + "</div>" + hint(f) + "</div>";
      case "object":
        return details(path, f.label, hint(f) + f.fields.map(function (sub) { return fieldHtml(sub, (value || {})[sub.name], path.concat(sub.name)); }).join(""));
      case "list":
        var items = value || [];
        return details(path, f.label + " (" + items.length + ")", hint(f) +
          items.map(function (item, i) {
            var ip = path.concat(i), ipStr = esc(ip.join("."));
            var tools = '<div class="ed-item-tools"><button type="button" data-act="up" data-path="' + ipStr + '" aria-label="위로">↑ 위로</button>' +
              '<button type="button" data-act="down" data-path="' + ipStr + '" aria-label="아래로">↓ 아래로</button>' +
              '<button type="button" class="danger" data-act="del" data-path="' + ipStr + '">× 삭제</button></div>';
            var body = f.fields
              ? f.fields.map(function (sub) { return fieldHtml(sub, item[sub.name], ip.concat(sub.name)); }).join("")
              : fieldHtml(f.field, item, ip);
            return details(ip, itemSummary(f, item, i), tools + body, "ed-item");
          }).join("") +
          '<p style="margin:0"><button type="button" class="ed-small" data-act="add" data-path="' + p + '">+ ' + esc(f.label.replace(/ \(.*\)$/, "")) + " 추가</button></p>");
      default:
        return '<div class="ed-field"><label for="' + id + '">' + esc(f.label) + '</label><input type="text" id="' + id + '" data-path="' + p + '" value="' + esc(value) + '">' + hint(f) + "</div>";
    }

  function findField(path) {
    // 경로(예: news.0.photos)에 해당하는 SCHEMA 항목을 찾습니다. 숫자는 목록 안의 순번입니다.
    var list = SCHEMA, f = null;
    for (var k = 0; k < path.length; k++) {
      if (typeof path[k] === "number") { if (!f.fields) return f.field; list = f.fields; continue; }
      f = list.filter(function (x) { return x.name === path[k]; })[0];
      if (f && f.fields) list = f.fields;
    }
    return f;
  }
  function parsePath(str) { return str.split(".").map(function (k) { return /^\d+$/.test(k) ? Number(k) : k; }); }

  function editorHtml() { return SCHEMA.map(function (f) { return fieldHtml(f, draft[f.name], [f.name]); }).join(""); }

    );

  function redrawEditor() { document.getElementById("editor").innerHTML = editorHtml(); }
  function resizeImage(file, done) {
    // 사진을 가로세로 1000px 이하 JPEG로 줄여 브라우저 저장 공간을 아낍니다. 서버로는 보내지 않습니다.
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, 1000 / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        done(c.toDataURL("image/jpeg", 0.75));
      };
      img.onerror = function () { done(null); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  function publish() {
    C = clone(draft);
    T = mergeTexts(C.texts);

  }
  function bindAdmin() {
    var ed = document.getElementById("editor");
    document.getElementById("admin-publish").addEventListener("click", publish);
    document.getElementById("admin-publish-2").addEventListener("click", publish);
    ed.addEventListener("toggle", function (e) {
      var key = e.target.getAttribute && e.target.getAttribute("data-open-key");
      if (key != null) openPaths[key] = e.target.open;
    }, true);
    ed.addEventListener("input", function (e) {
      var p = e.target.getAttribute("data-path");
      if (!p) return;
      setAt(draft, parsePath(p), e.target.type === "checkbox" ? e.target.checked : e.target.value);
      dirty = true;
    });
    ed.addEventListener("change", function (e) {
      var p = e.target.getAttribute("data-img-path");
      if (p && e.target.files[0]) {
        resizeImage(e.target.files[0], function (url) {
          if (!url) { toast("이미지를 읽지 못했습니다."); return; }
          setAt(draft, parsePath(p), url); dirty = true; redrawEditor();
        });
      }
    });
    ed.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-act]");
      if (!btn) return;
      var path = parsePath(btn.getAttribute("data-path")), act = btn.getAttribute("data-act");
      if (act === "clear") setAt(draft, path, "");
      if (act === "add") {
        var f = findField(path), list = getAt(draft, path);
        var item = f.fields ? emptyValue({ widget: "object", fields: f.fields }) : emptyValue(f.field);
        var at = f.addToTop ? 0 : list.length;
        list.splice(at, 0, item);
        openPaths[path.concat(at).join(".")] = true;
      }
      if (act === "del" || act === "up" || act === "down") {
        var i = path[path.length - 1], arr = getAt(draft, path.slice(0, -1));
        if (act === "del") {
          if (!confirm("이 항목을 삭제할까요? (게시해야 홈페이지에 반영됩니다)")) return;
          arr.splice(i, 1);
        } else {
          var j = act === "up" ? i - 1 : i + 1;
          if (j < 0 || j >= arr.length) return;
          var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
        }
        // 순서가 바뀌면 펼침 상태가 엉키므로 그 목록 안의 펼침 상태를 비웁니다.
        var prefix = path.slice(0, -1).join(".") + ".";
        Object.keys(openPaths).forEach(function (k) { if (k.indexOf(prefix) === 0) delete openPaths[k]; });
      }
      dirty = true;
      redrawEditor();
    });
  }
