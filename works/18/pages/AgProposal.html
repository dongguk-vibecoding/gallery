<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새벽코드 — 제안서 · 데모</title>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#C9CDD3}
a{color:#16181C}a:hover{color:#B3261E}
@keyframes slidein{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes stamp{0%{opacity:0;transform:scale(1.6) rotate(-14deg)}100%{opacity:1;transform:rotate(-8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<style>
.demo-bar{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:center;padding:10px 16px;background:#111111;color:#FFFFFF;font:500 14px/1.4 system-ui,-apple-system,'Malgun Gothic',sans-serif}
.demo-bar a{color:#FFFFFF;text-decoration:underline}
</style>
</head>
<body>
<div class="demo-bar"><a href="../index.html">← 시안 목록</a><span>데모 · 2 · 제안서가 된 페이지</span></div>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<div style="font-family: 'Hahmlet', serif; color: #16181C; background: #C9CDD3; font-size: 18px; line-height: 1.6; padding: 0 0 96px">
  <header style="padding: 24px 48px; display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: center">
    <a href="#" style="font-weight: 800; font-size: 22px; text-decoration: none">새벽코드</a>
    <nav aria-label="주요 메뉴" style="display: flex; flex-wrap: wrap; gap: 8px 32px; align-items: center; font-size: 16px">
      <a href="#scope" style="text-decoration: none">수행 범위</a>
      <a href="#schedule" style="text-decoration: none">일정</a>
      <a href="#team" style="text-decoration: none">팀</a>
      <a href="#sign" style="padding: 12px 20px; background: #16181C; color: #FFFFFF; text-decoration: none">제안서 받기</a>
    </nav>
  </header>

  <article style="max-width: 1040px; margin: 24px auto 0; background: #FFFFFF; padding: clamp(32px, 6vw, 96px); box-sizing: border-box; display: flex; flex-direction: column; gap: 120px; animation: slidein 800ms cubic-bezier(0.16,1,0.3,1) both">
    <div style="display: flex; flex-direction: column; gap: 40px">
      <dl style="margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 32px; font-size: 17px">
        <dt style="font-weight: 600">수신</dt><dd style="margin: 0">[귀사명] 귀하</dd>
        <dt style="font-weight: 600">발신</dt><dd style="margin: 0">새벽코드 외주개발팀</dd>
        <dt style="font-weight: 600">건명</dt><dd style="margin: 0">새 서비스 첫 출시를 위한 개발 제안</dd>
      </dl>
      <h1 style="margin: 0; font-size: clamp(48px, 6.5vw, 96px); font-weight: 800; line-height: 1; letter-spacing: -0.04em">외주개발,<br>제안서부터 다릅니다</h1>
      <p style="margin: 0; max-width: 620px; font-size: 20px">새벽코드는 웹과 앱을 만드는 개발 팀입니다. 이 홈페이지는 저희가 실제로 보내드리는 제안서와 같은 모양입니다. 무엇을, 언제까지, 누가 만드는지 첫 장에 적습니다.</p>
    </div>

    <section id="scope" aria-labelledby="scope-title" style="display: flex; flex-direction: column; gap: 32px">
      <h2 id="scope-title" style="margin: 0; font-size: clamp(32px, 3.5vw, 48px); font-weight: 800; letter-spacing: -0.02em">수행 범위</h2>
      <div style="overflow-x: auto">
        <table style="width: 100%; min-width: 560px; border-collapse: collapse; font-size: 18px">
          <thead><tr style="background: #16181C; color: #FFFFFF"><th scope="col" style="padding: 16px 20px; text-align: left">항목</th><th scope="col" style="padding: 16px 20px; text-align: left">내용</th><th scope="col" style="padding: 16px 20px; text-align: left">산출물</th></tr></thead>
          <tbody>
            <tr style="background: #F1F2F4"><th scope="row" style="padding: 18px 20px; text-align: left">기획</th><td style="padding: 18px 20px">출시 범위 확정, 화면 목록</td><td style="padding: 18px 20px">기획서 한 장</td></tr>
            <tr><th scope="row" style="padding: 18px 20px; text-align: left">디자인</th><td style="padding: 18px 20px">눌러볼 수 있는 시안</td><td style="padding: 18px 20px">프로토타입 링크</td></tr>
            <tr style="background: #F1F2F4"><th scope="row" style="padding: 18px 20px; text-align: left">개발</th><td style="padding: 18px 20px">웹·앱·서버, 매주 테스트 배포</td><td style="padding: 18px 20px">소스 코드 전체</td></tr>
            <tr><th scope="row" style="padding: 18px 20px; text-align: left">출시·운영</th><td style="padding: 18px 20px">스토어 심사, 오류 수정</td><td style="padding: 18px 20px">[유지보수 기간] 보증</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section id="schedule" aria-labelledby="schedule-title" style="display: flex; flex-direction: column; gap: 32px">
      <h2 id="schedule-title" style="margin: 0; font-size: clamp(32px, 3.5vw, 48px); font-weight: 800; letter-spacing: -0.02em">일정 예시</h2>
      <p style="margin: 0; max-width: 620px">앱 하나를 12주에 내는 경우의 예시입니다. 실제 일정은 상담 뒤 이 모양 그대로 보내드립니다.</p>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{phases}}" as="p" hint-placeholder-count="4">
          <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; align-items: center">
            <span style="font-weight: 600">{{p.name}}</span>
            <div style="height: 40px; background: #F1F2F4; position: relative"><div style="position: absolute; top: 0; bottom: 0; left: {{p.left}}; width: {{p.width}}; background: {{p.bg}}; color: #FFFFFF; font-size: 15px; display: flex; align-items: center; padding: 0 12px">{{p.weeks}}</div></div>
          </div>
        </sc-for>
      </div>
    </section>

    <section id="team" aria-labelledby="team-title" style="display: flex; flex-wrap: wrap; gap: 32px 64px; align-items: flex-start">
      <h2 id="team-title" style="flex: 1 1 220px; margin: 0; font-size: clamp(32px, 3.5vw, 48px); font-weight: 800; letter-spacing: -0.02em">투입 인력</h2>
      <div style="flex: 3 1 420px; display: flex; flex-direction: column; gap: 20px">
        <div style="min-height: 320px; background: #8C929C; padding: 20px; font-size: 14px; color: #FFFFFF">[사진: 팀 전원이 회의실 화이트보드 앞에 선 모습]</div>
        <p style="margin: 0">기획 1명, 디자이너 1명, 개발자 2~3명이 한 팀으로 끝까지 맡습니다. 중간에 담당자가 바뀌지 않습니다. [팀원 이름과 경력으로 교체]</p>
      </div>
    </section>

    <section id="sign" aria-labelledby="sign-title" style="display: flex; flex-wrap: wrap; gap: 32px; align-items: center; justify-content: space-between; background: #F1F2F4; padding: 48px">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <h2 id="sign-title" style="margin: 0; font-size: clamp(32px, 3.5vw, 48px); font-weight: 800; letter-spacing: -0.02em">귀사의 제안서를 받아 보세요</h2>
        <p style="margin: 0">아이디어를 메일로 보내 주시면 영업일 [N]일 안에 이 양식으로 회신합니다.</p>
      </div>
      <a href="mailto:hello@example.com" style="width: 160px; height: 160px; border-radius: 50%; border: 6px solid {{accent}}; color: {{accent}}; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 22px; font-weight: 800; text-decoration: none; animation: stamp 600ms 400ms cubic-bezier(0.16,1,0.3,1) both">제안서<br>요청</a>
    </section>
  </article>

  <footer style="max-width: 1040px; margin: 48px auto 0; padding: 0 48px; display: flex; flex-wrap: wrap; gap: 16px 48px; justify-content: space-between; font-size: 16px; color: #16181C">
    <span>[사업자 정보] · [주소]</span><span>© 2026 새벽코드</span>
  </footer>
</div>
</script>
<script type="text/x-dc" id="dc-logic" data-props='{"accent":{"editor":"color","default":"#B3261E","options":["#B3261E","#16181C","#1F4FD8"]},"$preview":{"width":1280,"height":2600}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#B3261E';
    const total = 12;
    const phases = [
      { name: '기획', start: 0, len: 2 },
      { name: '디자인', start: 1, len: 3 },
      { name: '개발', start: 3, len: 7 },
      { name: '출시', start: 10, len: 2 }
    ];
    return {
      accent,
      phases: phases.map((p, i) => ({
        name: p.name,
        weeks: p.len + '주',
        left: (p.start / total * 100) + '%',
        width: (p.len / total * 100) + '%',
        bg: i === 2 ? accent : '#16181C'
      }))
    };
  }
}
</script>
<script src="../dc-lite.js"></script>
</body>
</html>
