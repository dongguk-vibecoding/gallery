<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>링 베이글 홈 · 데모</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1E1A16}a:hover{color:#8A5A12}
@keyframes roll{from{opacity:0;transform:rotate(-90deg) scale(0.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<style>
.demo-bar{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:center;padding:10px 16px;background:#111111;color:#FFFFFF;font:500 14px/1.4 system-ui,-apple-system,'Malgun Gothic',sans-serif}
.demo-bar a{color:#FFFFFF;text-decoration:underline}
</style>
</head>
<body>
<div class="demo-bar"><a href="../index.html">← 시안 목록</a><span>데모 · F · 하나의 모티프 — 베이글 가게</span></div>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<div style="font-family: 'Gowun Dodum', sans-serif; color: #1E1A16; background: #FFFFFF; font-size: 19px; line-height: 1.55">
  <header style="padding: 24px 48px; display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: center">
    <a href="#" style="font-size: 26px; font-weight: 700; text-decoration: none">링 베이글</a>
    <nav aria-label="주요 메뉴" style="display: flex; flex-wrap: wrap; gap: 8px 32px; align-items: center; font-size: 17px">
      <a href="#today" style="text-decoration: none">오늘의 베이글</a>
      <a href="#dough" style="text-decoration: none">반죽 이야기</a>
      <a href="#pickup" style="text-decoration: none">픽업 안내</a>
      <a href="#pickup" style="width: 72px; height: 72px; border-radius: 50%; background: {{accent}}; color: #1E1A16; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 700">주문</a>
    </nav>
  </header>

  <section aria-labelledby="hero-title" style="padding: 64px 48px 160px; display: flex; flex-wrap: wrap; gap: 48px 64px; align-items: center">
    <div style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 24px">
      <h1 id="hero-title" style="margin: 0; font-size: clamp(64px, 8vw, 128px); line-height: 0.95; letter-spacing: -0.04em">링 베이글</h1>
      <p style="margin: 0; max-width: 400px">매일 새벽 끓는 물에 데친 뒤 굽는 베이글 가게입니다. 오전 열한 시면 대부분 다 나갑니다.</p>
      <a href="#today" style="align-self: flex-start; width: 140px; height: 140px; border-radius: 50%; background: #1E1A16; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; font-size: 18px">오늘 구운<br>베이글 보기</a>
    </div>
    <div style="flex: 1 1 480px; display: flex; justify-content: center">
      <div style="width: min(560px, 100%); aspect-ratio: 1; border-radius: 50%; background: #C9A26B; position: relative; display: flex; align-items: center; justify-content: center; animation: roll 900ms cubic-bezier(0.16,1,0.3,1) both">
        <div style="width: 22%; aspect-ratio: 1; border-radius: 50%; background: #FFFFFF"></div>
        <span style="position: absolute; bottom: 18%; left: 0; right: 0; text-align: center; font-size: 14px; color: #1E1A16">[사진: 위에서 본 참깨 베이글, 원형 크롭]</span>
      </div>
    </div>
  </section>

  <section id="today" aria-labelledby="today-title" style="background: #F3EEE6; padding: 160px 48px">
    <h2 id="today-title" style="margin: 0 0 64px; font-size: clamp(40px, 5vw, 64px); line-height: 1; letter-spacing: -0.03em">오늘 구운 베이글</h2>
    <div style="display: flex; flex-wrap: wrap; gap: 48px 40px; align-items: flex-end; justify-content: space-between">
      <sc-for list="{{bagels}}" as="b" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
          <div style="width: {{b.size}}; height: {{b.size}}; border-radius: 50%; background: {{b.bg}}; display: flex; align-items: center; justify-content: center">
            <div style="width: 24%; height: 24%; border-radius: 50%; background: #F3EEE6"></div>
          </div>
          <span style="font-size: 20px; font-weight: 700">{{b.name}}</span>
          <span style="font-size: 16px; color: #4A4038">[가격]</span>
        </div>
      </sc-for>
    </div>
  </section>

  <section id="dough" aria-labelledby="dough-title" style="background: #1E1A16; color: #FFFFFF; padding: 160px 48px; display: flex; flex-wrap: wrap; gap: 64px 96px; align-items: center">
    <div style="flex: 1 1 420px; display: flex; justify-content: center">
      <div style="width: min(520px, 100%); aspect-ratio: 1; border-radius: 50%; background: #5B4A3A; display: flex; align-items: center; justify-content: center; text-align: center; padding: 64px; box-sizing: border-box; font-size: 14px; color: #F3EEE6">[사진: 새벽 작업대 위 반죽을 고리로 마는 손, 원형 크롭]</div>
    </div>
    <div style="flex: 1 1 360px; max-width: 460px; display: flex; flex-direction: column; gap: 20px">
      <h2 id="dough-title" style="margin: 0; font-size: clamp(40px, 5vw, 64px); line-height: 1; letter-spacing: -0.03em">새벽 네 시의 반죽</h2>
      <p style="margin: 0; color: #EDE6DC">전날 저녁 반죽해 하룻밤 차갑게 재웁니다. 아침에 손으로 고리를 말고, 끓는 물에 데쳐 겉은 단단하게, 속은 쫀득하게 굽습니다.</p>
    </div>
  </section>

  <section id="pickup" aria-labelledby="pickup-title" style="padding: 160px 48px; display: flex; flex-wrap: wrap; gap: 48px 96px; align-items: center">
    <div style="flex: 2 1 420px; display: flex; flex-direction: column; gap: 24px">
      <h2 id="pickup-title" style="margin: 0; font-size: clamp(40px, 5vw, 64px); line-height: 1; letter-spacing: -0.03em">전날 주문, 아침 픽업</h2>
      <p style="margin: 0; max-width: 520px">오후 여덟 시까지 주문하면 다음 날 아침 일곱 시부터 이름표를 붙여 둡니다.</p>
      <dl style="margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 12px 32px">
        <dt style="font-weight: 700">주소</dt><dd style="margin: 0">[가게 주소]</dd>
        <dt style="font-weight: 700">영업</dt><dd style="margin: 0">[요일 · 시간]</dd>
      </dl>
    </div>
    <a href="#" style="flex: 0 0 auto; width: 240px; height: 240px; border-radius: 50%; background: {{accent}}; color: #1E1A16; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 28px; font-weight: 700">주문하기</a>
  </section>

  <footer style="background: {{accent}}; padding: 96px 48px 48px; display: flex; flex-wrap: wrap; gap: 32px; justify-content: space-between; align-items: flex-end">
    <p style="margin: 0; font-size: clamp(48px, 7vw, 104px); line-height: 1; letter-spacing: -0.04em">내일 아침에 만나요</p>
    <span style="font-size: 16px">© 2026 링 베이글 · [인스타그램]</span>
  </footer>
</div>
</script>
<script type="text/x-dc" id="dc-logic" data-props='{"accent":{"editor":"color","default":"#F2B544","options":["#F2B544","#9ED3A8","#F28C6B"]},"$preview":{"width":1280,"height":2700}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#F2B544',
      bagels: [
        { name: '플레인', size: '220px', bg: '#D9B98A' },
        { name: '참깨', size: '180px', bg: '#C9A26B' },
        { name: '어니언', size: '200px', bg: '#B88D58' },
        { name: '블루베리', size: '160px', bg: '#7D6A86' },
        { name: '에브리띵', size: '190px', bg: '#8F6E48' }
      ]
    };
  }
}
</script>
<script src="../dc-lite.js"></script>
</body>
</html>
