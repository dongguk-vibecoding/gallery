<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빛나 사진관 홈 · 데모</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1C1C1C}
a{color:#F2F0EC}a:hover{color:#FF8A80}
button{font:inherit;cursor:pointer;border:0;padding:0}
.frame{transition:transform 360ms cubic-bezier(0.16,1,0.3,1),outline-color 200ms}
.frame:hover{transform:scale(1.03)}
@keyframes develop{from{opacity:0;filter:brightness(2)}to{opacity:1;filter:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
<style>
.demo-bar{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:center;padding:10px 16px;background:#111111;color:#FFFFFF;font:500 14px/1.4 system-ui,-apple-system,'Malgun Gothic',sans-serif}
.demo-bar a{color:#FFFFFF;text-decoration:underline}
</style>
</head>
<body>
<div class="demo-bar"><a href="../index.html">← 시안 목록</a><span>데모 · J · 밀착 인화지 — 사진관</span></div>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<div style="font-family: 'Noto Sans KR', sans-serif; color: #F2F0EC; background: #1C1C1C; font-size: 18px; line-height: 1.55">
  <header style="padding: 24px 48px; display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: center">
    <a href="#" style="font-weight: 900; font-size: 22px; text-decoration: none">빛나 사진관</a>
    <nav aria-label="주요 메뉴" style="display: flex; flex-wrap: wrap; gap: 8px 32px; align-items: center; font-size: 16px">
      <a href="#sheet" style="text-decoration: none">촬영 종류</a>
      <a href="#print" style="text-decoration: none">인화</a>
      <a href="#visit" style="text-decoration: none">오시는 길</a>
      <a href="#visit" style="padding: 12px 20px; background: {{accent}}; color: #FFFFFF; font-weight: 700; text-decoration: none">촬영 예약</a>
    </nav>
  </header>

  <section id="sheet" aria-labelledby="hero-title" style="padding: 48px 48px 160px; display: flex; flex-direction: column; gap: 40px">
    <div style="display: flex; flex-wrap: wrap; gap: 16px 64px; align-items: flex-end; justify-content: space-between">
      <h1 id="hero-title" style="margin: 0; font-size: clamp(56px, 7vw, 112px); font-weight: 900; line-height: 0.95; letter-spacing: -0.04em">빛나 사진관</h1>
      <p style="margin: 0; max-width: 420px">필름 밀착 인화지처럼 펼쳐 봤어요. 마음에 드는 칸을 눌러 크게 보세요.</p>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 32px 40px; align-items: stretch">
      <div style="flex: 999 1 560px; min-height: 560px; background: {{current.tone}}; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; animation: develop 500ms both">
        <span style="font-size: 14px; color: {{current.ink}}">[사진: {{current.shot}}]</span>
        <div aria-live="polite" style="background: rgba(20,20,20,0.72); padding: 24px 28px; display: flex; flex-direction: column; gap: 8px; max-width: 520px">
          <h2 style="margin: 0; font-size: 32px; font-weight: 700; color: #FFFFFF">{{current.name}}</h2>
          <p style="margin: 0; color: #ECEAE6">{{current.desc}}</p>
        </div>
      </div>
      <div role="group" aria-label="촬영 종류 선택" style="flex: 1 1 320px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-content: start; background: #111111; padding: 16px">
        <sc-for list="{{frames}}" as="f" hint-placeholder-count="9">
          <button type="button" class="frame" aria-pressed="{{f.pressed}}" aria-label="{{f.name}}" onClick="{{f.pick}}" style="aspect-ratio: 3 / 4; background: {{f.tone}}; outline: 4px solid {{f.ring}}; outline-offset: 3px; color: {{f.ink}}; font-size: 13px; display: flex; align-items: flex-end; padding: 8px; text-align: left">{{f.name}}</button>
        </sc-for>
      </div>
    </div>
  </section>

  <section aria-labelledby="price-title" style="background: #F2F0EC; color: #1C1C1C; padding: 160px 48px; display: flex; flex-wrap: wrap; gap: 48px 96px">
    <h2 id="price-title" style="flex: 1 1 280px; margin: 0; font-size: clamp(40px, 5vw, 72px); font-weight: 900; letter-spacing: -0.03em; line-height: 1">촬영과 가격</h2>
    <div style="flex: 3 1 520px; display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{frames}}" as="f" hint-placeholder-count="9">
        <div style="display: flex; flex-wrap: wrap; gap: 8px 32px; align-items: baseline; padding: 20px 24px; background: {{f.row}}">
          <span style="flex: 1 1 200px; font-weight: 700; font-size: 20px">{{f.name}}</span>
          <span style="flex: 2 1 260px; color: #3A3A3A">{{f.desc}}</span>
          <span style="flex: 0 0 auto; font-weight: 700">[가격]</span>
        </div>
      </sc-for>
    </div>
  </section>

  <section id="print" aria-labelledby="print-title" style="padding: 160px 48px; display: flex; flex-wrap: wrap; gap: 48px 96px; align-items: center">
    <div style="flex: 999 1 480px; min-height: 600px; background: #5A1E1A; padding: 24px; box-sizing: border-box; font-size: 14px; color: #F2F0EC">[사진: 붉은 안전등 아래 현상액에서 떠오르는 인화지]</div>
    <div style="flex: 1 1 320px; max-width: 420px; display: flex; flex-direction: column; gap: 20px">
      <h2 id="print-title" style="margin: 0; font-size: clamp(40px, 5vw, 72px); font-weight: 900; letter-spacing: -0.03em; line-height: 1">인화는 직접 합니다</h2>
      <p style="margin: 0; color: #DEDBD5">고른 사진은 암실에서 한 장씩 인화해 액자에 넣어 드립니다. 파일도 함께 보내 드려요.</p>
    </div>
  </section>

  <footer id="visit" style="background: {{accent}}; color: #FFFFFF; padding: 120px 48px 48px; display: flex; flex-direction: column; gap: 80px">
    <div style="display: flex; flex-wrap: wrap; gap: 32px 64px; align-items: flex-end; justify-content: space-between">
      <p style="margin: 0; font-size: clamp(44px, 6vw, 88px); font-weight: 900; letter-spacing: -0.04em; line-height: 1">한 칸을 골라<br>오세요</p>
      <div style="display: flex; flex-direction: column; gap: 16px; max-width: 360px">
        <p style="margin: 0">[사진관 주소] · [영업 시간] · [전화번호]</p>
        <a href="#" style="align-self: flex-start; padding: 18px 28px; background: #FFFFFF; color: #1C1C1C; font-weight: 700; text-decoration: none">촬영 예약하기</a>
      </div>
    </div>
    <p style="margin: 0; font-size: 16px">© 2026 빛나 사진관</p>
  </footer>
</div>
</script>
<script type="text/x-dc" id="dc-logic" data-props='{"accent":{"editor":"color","default":"#C42B22","options":["#C42B22","#1C1C1C","#2D5A8A"]},"$preview":{"width":1280,"height":2700}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 0 };
  }
  renderVals() {
    const accent = this.props.accent ?? '#C42B22';
    const list = [
      { name: '가족사진', shot: '삼대가 함께 앉은 스튜디오 가족사진', desc: '흰 배경과 나무 의자 하나. 가장 오래 남을 한 장을 찍습니다.', tone: '#8A857D', ink: '#141414' },
      { name: '증명사진', shot: '정면 증명사진', desc: '보정은 자연스럽게, 당일 인화해 드립니다.', tone: '#C9C5BE', ink: '#141414' },
      { name: '돌사진', shot: '한복 입은 아기 돌사진', desc: '아기 컨디션에 맞춰 천천히, 쉬어 가며 찍습니다.', tone: '#6E6A63', ink: '#FFFFFF' },
      { name: '프로필', shot: '창가 자연광 프로필', desc: '창가 자연광으로 찍는 상반신 프로필.', tone: '#A9A49C', ink: '#141414' },
      { name: '커플 사진', shot: '골목에서 걷는 두 사람', desc: '사진관 앞 골목까지 나가 걸으며 찍습니다.', tone: '#57534D', ink: '#FFFFFF' },
      { name: '반려동물', shot: '의자 위 강아지', desc: '간식과 장난감을 챙겨 오세요.', tone: '#D8D4CC', ink: '#141414' },
      { name: '장수 사진', shot: '어르신 정면 초상', desc: '편한 옷차림 그대로, 집으로 출장도 갑니다.', tone: '#7A766F', ink: '#FFFFFF' },
      { name: '졸업 사진', shot: '학사모 쓴 졸업생', desc: '가운과 학사모를 대여해 드립니다.', tone: '#B7B2AA', ink: '#141414' },
      { name: '필름 촬영', shot: '흑백 필름 인물 사진', desc: '흑백 필름으로 찍고 암실에서 인화합니다.', tone: '#3F3C38', ink: '#FFFFFF' }
    ];
    const picked = this.state.picked;
    return {
      accent,
      current: list[picked],
      frames: list.map((f, i) => ({
        ...f,
        pressed: i === picked ? 'true' : 'false',
        ring: i === picked ? '#FF5A4E' : 'transparent',
        row: i % 2 === 0 ? '#E6E3DD' : '#F2F0EC',
        pick: () => this.setState({ picked: i })
      }))
    };
  }
}
</script>
<script src="../dc-lite.js"></script>
</body>
</html>
