<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결 커피 로스터스 홈 · 데모</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F4F2}
a{color:#24170F}a:hover{color:#1F4FD8}
@keyframes stamp{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<style>
.demo-bar{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:center;padding:10px 16px;background:#111111;color:#FFFFFF;font:500 14px/1.4 system-ui,-apple-system,'Malgun Gothic',sans-serif}
.demo-bar a{color:#FFFFFF;text-decoration:underline}
</style>
</head>
<body>
<div class="demo-bar"><a href="../index.html">← 시안 목록</a><span>데모 · B · 원두 라벨이 된 페이지 — 로스터리</span></div>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<div style="font-family: 'Noto Sans KR', sans-serif; color: #24170F; background: #F4F4F2; font-size: 18px; line-height: 1.55">
  <header style="padding: 24px 40px; display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: center">
    <a href="#" style="font-family: 'Noto Serif KR', serif; font-weight: 900; font-size: 26px; text-decoration: none">결</a>
    <nav aria-label="주요 메뉴" style="display: flex; flex-wrap: wrap; gap: 8px 32px; align-items: center; font-size: 16px; font-weight: 500">
      <a href="#beans" style="text-decoration: none">이번 주 원두</a>
      <a href="#cafe" style="text-decoration: none">카페</a>
      <a href="#visit" style="text-decoration: none">오시는 길</a>
      <a href="#beans" style="padding: 12px 20px; background: {{accent}}; color: #FFFFFF; text-decoration: none">원두 구매</a>
    </nav>
  </header>

  <section aria-labelledby="hero-title" style="padding: 0 40px; display: flex; flex-wrap: wrap; gap: 0">
    <div style="flex: 1 1 420px; min-height: 760px; background: #B9AFA4; padding: 24px; box-sizing: border-box; font-size: 14px; color: #24170F">[사진: 카운터 위 원두 봉투, 위에서 내려다본 구도]</div>
    <div style="flex: 1 1 420px; background: {{accent}}; color: #FFFFFF; padding: 56px 48px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 48px; animation: stamp 600ms cubic-bezier(0.22,1,0.36,1) both">
      <h1 style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: clamp(56px, 7vw, 104px); font-weight: 900; line-height: 0.95; letter-spacing: -0.03em">결 커피<br>로스터스</h1>
      <dl style="margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 14px 32px; font-size: 18px">
        <dt style="font-weight: 700">로스팅</dt><dd style="margin: 0">매주 화요일 아침, 망원동 작업실</dd>
        <dt style="font-weight: 700">배송</dt><dd style="margin: 0">볶은 지 사흘 안에 문 앞까지</dd>
        <dt style="font-weight: 700">이번 주</dt><dd style="margin: 0">[원두명] — [테이스팅 노트]</dd>
        <dt style="font-weight: 700">로스팅 일자</dt><dd style="margin: 0">[YYYY. MM. DD]</dd>
      </dl>
      <p style="margin: 0; font-size: 20px; max-width: 420px">봉투에 붙은 라벨 그대로, 무엇을 언제 볶았는지 숨김없이 적습니다.</p>
    </div>
  </section>

  <section id="beans" aria-labelledby="beans-title" style="padding: 160px 40px">
    <div style="display: flex; flex-wrap: wrap; gap: 24px 80px; align-items: flex-end; justify-content: space-between; margin-bottom: 56px">
      <h2 id="beans-title" style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: clamp(40px, 5vw, 64px); font-weight: 900; letter-spacing: -0.02em; line-height: 1">이번 주 원두</h2>
      <p style="margin: 0; max-width: 420px">세 가지만 볶습니다. 다 팔리면 다음 화요일까지 기다려 주세요.</p>
    </div>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{beans}}" as="b" hint-placeholder-count="3">
        <div style="display: flex; flex-wrap: wrap; gap: 12px 40px; align-items: baseline; padding: 32px; background: {{b.bg}}">
          <span style="flex: 1 1 220px; font-family: 'Noto Serif KR', serif; font-size: 30px; font-weight: 700">{{b.name}}</span>
          <span style="flex: 2 1 280px">{{b.note}}</span>
          <span style="flex: 0 0 auto; font-weight: 700">[가격]</span>
          <a href="#" style="flex: 0 0 auto; padding: 12px 20px; background: #24170F; color: #FFFFFF; text-decoration: none; font-size: 16px">담기</a>
        </div>
      </sc-for>
    </div>
  </section>

  <section id="cafe" aria-labelledby="cafe-title" style="position: relative; min-height: 680px; background: #6E5F52; display: flex; align-items: flex-end">
    <span style="position: absolute; top: 24px; left: 40px; font-size: 14px; color: #F4F4F2">[사진: 로스터기 옆 바 좌석, 오후 빛]</span>
    <div style="margin: 0 40px 40px; padding: 40px; background: rgba(36,23,15,0.72); color: #FFFFFF; max-width: 560px; display: flex; flex-direction: column; gap: 16px">
      <h2 id="cafe-title" style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: 40px; font-weight: 900; line-height: 1.1">로스터 옆 여섯 자리</h2>
      <p style="margin: 0">볶는 소리를 들으며 마시는 카페입니다. 핸드드립은 바에서 직접 내려 드립니다.</p>
    </div>
  </section>

  <section id="visit" aria-labelledby="visit-title" style="background: #24170F; color: #FFFFFF; padding: 160px 40px; display: flex; flex-wrap: wrap; gap: 48px 96px">
    <h2 id="visit-title" style="flex: 1 1 300px; margin: 0; font-family: 'Noto Serif KR', serif; font-size: clamp(40px, 5vw, 64px); font-weight: 900; line-height: 1">오시는 길</h2>
    <dl style="flex: 2 1 420px; margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 20px 40px; font-size: 20px">
      <dt style="font-weight: 700">주소</dt><dd style="margin: 0">[카페 주소]</dd>
      <dt style="font-weight: 700">영업</dt><dd style="margin: 0">[요일 · 시간] / 화요일 오전은 로스팅으로 쉽니다</dd>
      <dt style="font-weight: 700">문의</dt><dd style="margin: 0">[전화번호] · [인스타그램]</dd>
    </dl>
  </section>

  <footer style="background: {{accent}}; color: #FFFFFF; padding: 96px 40px 40px; display: flex; flex-direction: column; gap: 64px">
    <p style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: clamp(40px, 6vw, 88px); font-weight: 900; line-height: 1; letter-spacing: -0.03em">다음 화요일에 만나요</p>
    <div style="display: flex; flex-wrap: wrap; gap: 16px 48px; font-size: 16px"><a href="#" style="color: #FFFFFF">정기 배송 알림 받기</a><span>© 2026 결 커피 로스터스</span></div>
  </footer>
</div>
</script>
<script type="text/x-dc" id="dc-logic" data-props='{"accent":{"editor":"color","default":"#1F4FD8","options":["#1F4FD8","#1F6B4A","#B3261E"]},"$preview":{"width":1280,"height":2700}}'>
class Component extends DCLogic {
  renderVals() {
    const beans = [
      { name: '[원두명 A]', note: '[산지] · [가공 방식] — [테이스팅 노트]' },
      { name: '[원두명 B]', note: '[산지] · [가공 방식] — [테이스팅 노트]' },
      { name: '결 블렌드', note: '매일 마시기 좋은 하우스 블렌드 — [테이스팅 노트]' }
    ];
    return {
      accent: this.props.accent ?? '#1F4FD8',
      beans: beans.map((b, i) => ({ ...b, bg: i % 2 === 0 ? '#E7E5E0' : '#F4F4F2' }))
    };
  }
}
</script>
<script src="../dc-lite.js"></script>
</body>
</html>
