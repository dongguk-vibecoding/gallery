<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한결 세탁소 홈 · 데모</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#0A0A0A}a:hover{color:#5C1A1B}
@keyframes curtain{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<style>
.demo-bar{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:center;padding:10px 16px;background:#111111;color:#FFFFFF;font:500 14px/1.4 system-ui,-apple-system,'Malgun Gothic',sans-serif}
.demo-bar a{color:#FFFFFF;text-decoration:underline}
</style>
</head>
<body>
<div class="demo-bar"><a href="../index.html">← 시안 목록</a><span>데모 · G · 다른 업종의 옷 — 세탁소</span></div>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<div style="font-family: 'Noto Serif KR', serif; color: #0A0A0A; background: #FFFFFF; font-size: 18px; line-height: 1.6">
  <header style="padding: 28px 48px; display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: center">
    <a href="#" style="font-size: 22px; font-weight: 900; text-decoration: none">한결</a>
    <nav aria-label="주요 메뉴" style="display: flex; flex-wrap: wrap; gap: 8px 36px; align-items: center; font-size: 16px">
      <a href="#look" style="text-decoration: none">이번 시즌</a>
      <a href="#atelier" style="text-decoration: none">아틀리에</a>
      <a href="#visit" style="text-decoration: none">매장</a>
      <a href="#visit" style="padding: 12px 22px; background: #0A0A0A; color: #FFFFFF; text-decoration: none">수거 예약</a>
    </nav>
  </header>

  <section aria-labelledby="hero-title" style="position: relative; margin: 0 48px; min-height: 820px; background: #DEDCD8; display: flex; align-items: flex-end">
    <span style="position: absolute; top: 24px; right: 24px; font-size: 14px; color: #2A2A2A">[사진: 다림질을 마친 흰 셔츠 한 벌, 옷걸이에 걸린 정면 컷]</span>
    <div style="padding: 48px; display: flex; flex-direction: column; gap: 16px; animation: curtain 900ms cubic-bezier(0.16,1,0.3,1) both">
      <h1 id="hero-title" style="margin: 0; font-size: clamp(72px, 11vw, 168px); font-weight: 900; line-height: 0.9; letter-spacing: -0.05em">한결 세탁소</h1>
      <p style="margin: 0; font-size: 24px">이번 시즌, 당신의 옷을 다시 새것처럼.</p>
    </div>
  </section>

  <section id="look" aria-labelledby="look-title" style="padding: 200px 48px 160px">
    <div style="display: flex; flex-wrap: wrap; gap: 24px 96px; align-items: flex-end; margin-bottom: 72px">
      <h2 id="look-title" style="margin: 0; font-size: clamp(44px, 5.5vw, 80px); font-weight: 900; letter-spacing: -0.04em; line-height: 1">가을 · 겨울 룩북</h2>
      <p style="margin: 0; max-width: 420px">패션 하우스가 새 컬렉션을 소개하듯, 이번 계절 저희가 가장 많이 돌보는 옷들을 소개합니다.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 48px 32px; align-items: start">
      <figure style="margin: 0; grid-row: span 2; display: flex; flex-direction: column; gap: 16px">
        <div style="min-height: 760px; background: #2B2B2B; color: #F2F2F0; padding: 20px; font-size: 14px">[사진: 울 코트, 모델 착용 전신]</div>
        <figcaption style="display: flex; justify-content: space-between; gap: 16px; font-size: 20px"><span style="font-weight: 600">울 코트 — 드라이클리닝과 스팀</span><span>[가격]</span></figcaption>
      </figure>
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 16px">
        <div style="min-height: 340px; background: #E9E8E5; padding: 20px; font-size: 14px; color: #2A2A2A">[사진: 셔츠 소매 클로즈업]</div>
        <figcaption style="display: flex; justify-content: space-between; gap: 16px; font-size: 20px"><span style="font-weight: 600">셔츠 — 손다림</span><span>[가격]</span></figcaption>
      </figure>
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 16px; padding-top: 120px">
        <div style="min-height: 300px; background: #8C8A86; padding: 20px; font-size: 14px; color: #FFFFFF">[사진: 접어 둔 캐시미어 니트]</div>
        <figcaption style="display: flex; justify-content: space-between; gap: 16px; font-size: 20px"><span style="font-weight: 600">캐시미어 니트 — 손세탁</span><span>[가격]</span></figcaption>
      </figure>
    </div>
  </section>

  <section id="atelier" aria-labelledby="atelier-title" style="background: #0A0A0A; color: #FFFFFF; padding: 160px 48px; display: flex; flex-wrap: wrap; gap: 56px 96px; align-items: center">
    <div style="flex: 1 1 340px; max-width: 480px; display: flex; flex-direction: column; gap: 20px">
      <h2 id="atelier-title" style="margin: 0; font-size: clamp(44px, 5.5vw, 80px); font-weight: 900; letter-spacing: -0.04em; line-height: 1">아틀리에</h2>
      <p style="margin: 0; color: #E6E6E3">[운영 연수]년째 같은 자리. 단추 하나, 실밥 하나까지 맡긴 그대로 돌려드립니다. 수선도 함께 받습니다.</p>
    </div>
    <div style="flex: 999 1 480px; min-height: 620px; background: #3A3A3A; padding: 24px; box-sizing: border-box; font-size: 14px; color: #E6E6E3">[사진: 스팀 다리미 김이 오르는 작업대, 흑백]</div>
  </section>

  <section id="visit" aria-labelledby="visit-title" style="padding: 160px 48px 48px; display: flex; flex-direction: column; gap: 120px">
    <div style="display: flex; flex-wrap: wrap; gap: 40px 96px; align-items: flex-end; justify-content: space-between">
      <h2 id="visit-title" style="margin: 0; font-size: clamp(56px, 8vw, 120px); font-weight: 900; letter-spacing: -0.05em; line-height: 0.95">문 앞에서<br>모셔 갑니다</h2>
      <div style="display: flex; flex-direction: column; gap: 16px; max-width: 360px">
        <p style="margin: 0">[수거 가능 지역] · [매장 주소] · [영업 시간]</p>
        <a href="#" style="align-self: flex-start; padding: 18px 28px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 600">수거 예약하기</a>
      </div>
    </div>
    <p style="margin: 0; font-size: 16px; color: #3A3A3A">© 2026 한결 세탁소</p>
  </section>
</div>
</script>
<script type="text/x-dc" id="dc-logic" data-props='{"accent":{"editor":"color","default":"#5C1A1B","options":["#5C1A1B","#0A0A0A","#1F3B5C"]},"$preview":{"width":1280,"height":2700}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#5C1A1B' };
  }
}
</script>
<script src="../dc-lite.js"></script>
</body>
</html>
