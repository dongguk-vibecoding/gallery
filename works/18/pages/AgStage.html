<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새벽코드 — 고정된 휴대폰 무대 · 데모</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F5F7}
a{color:#14161A}a:hover{color:#00795A}
.stage{position:sticky;top:24px}
@media (max-width: 900px){.stage{position:static}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<style>
.demo-bar{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:center;padding:10px 16px;background:#111111;color:#FFFFFF;font:500 14px/1.4 system-ui,-apple-system,'Malgun Gothic',sans-serif}
.demo-bar a{color:#FFFFFF;text-decoration:underline}
</style>
</head>
<body>
<div class="demo-bar"><a href="../index.html">← 시안 목록</a><span>데모 · 5 · 고정된 휴대폰 무대</span></div>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<div style="font-family: 'Noto Sans KR', sans-serif; color: #14161A; background: #F4F5F7; font-size: 18px; line-height: 1.55">
  <header style="padding: 24px 48px; display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: center">
    <a href="#" style="font-weight: 900; font-size: 22px; letter-spacing: -0.03em; text-decoration: none">새벽코드</a>
    <nav aria-label="주요 메뉴" style="display: flex; flex-wrap: wrap; gap: 8px 32px; align-items: center; font-size: 16px; font-weight: 500">
      <a href="#journey" style="text-decoration: none">만드는 과정</a>
      <a href="#work" style="text-decoration: none">작업</a>
      <a href="#contact" style="text-decoration: none">문의</a>
      <a href="#contact" style="padding: 12px 20px; background: #14161A; color: #FFFFFF; font-weight: 700; text-decoration: none">상담 신청</a>
    </nav>
  </header>

  <section aria-labelledby="hero-title" style="padding: 72px 48px 120px">
    <h1 id="hero-title" style="margin: 0; max-width: 980px; font-size: clamp(52px, 7vw, 108px); font-weight: 900; line-height: 0.98; letter-spacing: -0.045em; animation: rise 700ms cubic-bezier(0.16,1,0.3,1) both">아이디어 한 줄이<br>앱이 되기까지</h1>
    <p style="margin: 32px 0 0; max-width: 520px; font-size: 20px">새벽코드는 웹과 앱을 만드는 외주 개발 팀입니다. 한 앱이 만들어지는 12주를 따라가 보세요.</p>
  </section>

  <div id="journey" style="padding: 0 48px 160px; display: flex; flex-wrap: wrap-reverse; gap: 64px 96px; align-items: flex-start">
    <div style="flex: 999 1 520px; display: flex; flex-direction: column; gap: 200px; padding-top: 40px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <section style="display: flex; flex-direction: column; gap: 16px; max-width: 560px">
          <p style="margin: 0; font-size: 20px; font-weight: 700; color: {{s.tone}}">{{s.when}}</p>
          <h2 style="margin: 0; font-size: clamp(36px, 4vw, 56px); font-weight: 900; letter-spacing: -0.03em; line-height: 1.05">{{s.title}}</h2>
          <p style="margin: 0">{{s.body}}</p>
        </section>
      </sc-for>
    </div>
    <aside class="stage" aria-label="완성된 앱 미리보기" style="flex: 1 1 260px; min-width: 0; display: flex; justify-content: center">
      <div style="width: 340px; max-width: 100%; aspect-ratio: 9 / 18.5; background: #14161A; border-radius: 48px; padding: 14px; box-sizing: border-box; animation: float 6s ease-in-out infinite">
        <div style="width: 100%; height: 100%; border-radius: 36px; background: {{accent}}; display: flex; flex-direction: column; justify-content: space-between; padding: 28px 22px; box-sizing: border-box">
          <span style="font-size: 14px; color: #14161A">[앱 화면: 완성된 예약 앱 홈]</span>
          <div style="background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 6px">
            <span style="font-weight: 700">[앱 이름]</span>
            <span style="font-size: 15px; color: #3A3E45">[대표 기능 한 줄]</span>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <section id="work" aria-labelledby="work-title" style="background: #14161A; color: #FFFFFF; padding: 160px 48px; display: flex; flex-wrap: wrap; gap: 32px">
    <h2 id="work-title" style="flex: 1 1 100%; margin: 0 0 24px; font-size: clamp(36px, 4vw, 56px); font-weight: 900; letter-spacing: -0.03em">이렇게 나온 앱들</h2>
    <div style="flex: 1 1 260px; min-height: 480px; background: #2C3038; padding: 20px; font-size: 14px; color: #E6E8EB">[앱 화면: 프로젝트 A]</div>
    <div style="flex: 1 1 260px; min-height: 480px; background: #3A3F49; padding: 20px; font-size: 14px; color: #E6E8EB; margin-top: 80px">[앱 화면: 프로젝트 B]</div>
    <div style="flex: 1 1 260px; min-height: 480px; background: #2C3038; padding: 20px; font-size: 14px; color: #E6E8EB">[앱 화면: 프로젝트 C]</div>
  </section>

  <section id="contact" aria-labelledby="contact-title" style="padding: 160px 48px 48px; display: flex; flex-direction: column; gap: 96px">
    <div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-end; justify-content: space-between">
      <h2 id="contact-title" style="margin: 0; font-size: clamp(48px, 6.5vw, 96px); font-weight: 900; letter-spacing: -0.045em; line-height: 1">다음 12주는<br>당신의 앱</h2>
      <a href="mailto:hello@example.com" style="padding: 18px 28px; background: {{accent}}; color: #14161A; font-weight: 700; text-decoration: none">아이디어 보내기</a>
    </div>
    <p style="margin: 0; font-size: 16px; color: #3A3E45">[사업자 정보] · [주소] · © 2026 새벽코드</p>
  </section>
</div>
</script>
<script type="text/x-dc" id="dc-logic" data-props='{"accent":{"editor":"color","default":"#3DDC97","options":["#3DDC97","#FFD23F","#7FC8F8"]},"$preview":{"width":1280,"height":2600}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#3DDC97',
      steps: [
        { when: '첫 만남', title: '한 시간 대화', body: '무엇을, 누구를 위해 만드는지 듣습니다. 만들 수 없는 건 그 자리에서 말씀드립니다.', tone: '#00795A' },
        { when: '2주 차', title: '눌러보는 시안', body: '휴대폰에 시안 링크를 보내드립니다. 그림이 아니라 실제로 눌러보며 고칩니다.', tone: '#00795A' },
        { when: '6주 차', title: '첫 테스트 버전', body: '로그인부터 핵심 기능까지 돌아가는 앱을 설치해 써 보실 수 있습니다.', tone: '#00795A' },
        { when: '12주 차', title: '스토어 출시', body: '심사 대응과 서버 설정까지 끝내고, 출시 뒤 [유지보수 기간] 동안 함께 지켜봅니다.', tone: '#00795A' }
      ]
    };
  }
}
</script>
<script src="../dc-lite.js"></script>
</body>
</html>
