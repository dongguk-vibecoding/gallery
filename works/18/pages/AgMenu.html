<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새벽코드 — 개발 코스 메뉴 · 데모</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#12241C}
a{color:#F1EDE4}a:hover{color:#D9B45A}
@keyframes serve{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.course{animation:serve 700ms cubic-bezier(0.16,1,0.3,1) both}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<style>
.demo-bar{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:center;padding:10px 16px;background:#111111;color:#FFFFFF;font:500 14px/1.4 system-ui,-apple-system,'Malgun Gothic',sans-serif}
.demo-bar a{color:#FFFFFF;text-decoration:underline}
</style>
</head>
<body>
<div class="demo-bar"><a href="../index.html">← 시안 목록</a><span>데모 · 8 · 레스토랑 코스 메뉴처럼</span></div>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<div style="font-family: 'Gowun Batang', serif; color: #F1EDE4; background: #12241C; font-size: 19px; line-height: 1.6">
  <header style="padding: 24px 48px; display: flex; flex-wrap: wrap; gap: 16px 40px; justify-content: space-between; align-items: center">
    <a href="#" style="font-weight: 700; font-size: 24px; text-decoration: none">새벽코드</a>
    <nav aria-label="주요 메뉴" style="display: flex; flex-wrap: wrap; gap: 8px 32px; align-items: center; font-size: 17px">
      <a href="#course" style="text-decoration: none">코스</a>
      <a href="#chef" style="text-decoration: none">주방</a>
      <a href="#reserve" style="text-decoration: none">예약</a>
      <a href="#reserve" style="padding: 12px 20px; background: {{accent}}; color: #12241C; font-weight: 700; text-decoration: none">상담 예약</a>
    </nav>
  </header>

  <section aria-labelledby="hero-title" style="padding: 64px 48px 160px; display: flex; flex-wrap: wrap; gap: 48px 64px; align-items: flex-end">
    <div style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 24px">
      <h1 id="hero-title" style="margin: 0; font-size: clamp(56px, 7.5vw, 116px); font-weight: 700; line-height: 0.98; letter-spacing: -0.03em">오늘의<br>개발 코스</h1>
      <p style="margin: 0; max-width: 420px">새벽코드는 웹과 앱을 만드는 외주 개발 팀입니다. 좋은 식당이 코스를 내듯, 순서대로 하나씩 차려 드립니다.</p>
    </div>
    <div style="flex: 1.3 1 480px; min-height: 560px; background: #2B4337; padding: 24px; box-sizing: border-box; font-size: 14px; color: #F1EDE4">[사진: 어두운 조명 아래 노트북과 커피, 접시처럼 놓인 앱 화면 출력물]</div>
  </section>

  <section id="course" aria-labelledby="course-title" style="background: #F1EDE4; color: #12241C; padding: 160px 48px">
    <div style="display: flex; flex-wrap: wrap; gap: 16px 96px; align-items: baseline; margin-bottom: 80px">
      <h2 id="course-title" style="margin: 0; font-size: clamp(44px, 5.5vw, 80px); font-weight: 700; line-height: 1">코스 안내</h2>
      <p style="margin: 0; max-width: 420px; color: #33443B">모든 코스는 프로젝트에 맞춰 조리합니다. 가격은 상담 뒤 안내합니다.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 64px; max-width: 1040px">
      <sc-for list="{{courses}}" as="c" hint-placeholder-count="5">
        <div class="course" style="display: flex; flex-wrap: wrap; gap: 8px 64px; align-items: baseline; animation-delay: {{c.delay}}">
          <p style="flex: 0 0 140px; margin: 0; color: #5A4A1E; font-size: 18px">{{c.kind}}</p>
          <div style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 8px">
            <h3 style="margin: 0; font-size: clamp(30px, 3.2vw, 44px); font-weight: 700; line-height: 1.1">{{c.name}}</h3>
            <p style="margin: 0; color: #33443B">{{c.desc}}</p>
          </div>
          <p style="flex: 0 0 auto; margin: 0; font-size: 18px">{{c.price}}</p>
        </div>
      </sc-for>
    </div>
  </section>

  <section id="chef" aria-labelledby="chef-title" style="padding: 160px 48px; display: flex; flex-wrap: wrap; gap: 48px 96px; align-items: center">
    <div style="flex: 999 1 480px; min-height: 600px; background: #2B4337; padding: 24px; box-sizing: border-box; font-size: 14px; color: #F1EDE4">[사진: 팀 전원, 주방처럼 꾸민 작업실에서]</div>
    <div style="flex: 1 1 320px; max-width: 440px; display: flex; flex-direction: column; gap: 20px">
      <h2 id="chef-title" style="margin: 0; font-size: clamp(44px, 5.5vw, 80px); font-weight: 700; line-height: 1">주방 사람들</h2>
      <p style="margin: 0">기획, 디자인, 개발을 맡는 사람이 한 주방에 있습니다. 주문받은 사람이 끝까지 요리합니다. [팀 소개로 교체]</p>
    </div>
  </section>

  <section id="reserve" aria-labelledby="reserve-title" style="background: {{accent}}; color: #12241C; padding: 160px 48px 48px; display: flex; flex-direction: column; gap: 96px">
    <div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-end; justify-content: space-between">
      <h2 id="reserve-title" style="margin: 0; font-size: clamp(52px, 7vw, 112px); font-weight: 700; line-height: 0.98; letter-spacing: -0.03em">자리를<br>예약하세요</h2>
      <a href="mailto:hello@example.com" style="padding: 18px 28px; background: #12241C; color: #F1EDE4; font-weight: 700; text-decoration: none">상담 예약하기</a>
    </div>
    <p style="margin: 0; font-size: 16px">[사업자 정보] · [주소] · © 2026 새벽코드</p>
  </section>
</div>
</script>
<script type="text/x-dc" id="dc-logic" data-props='{"accent":{"editor":"color","default":"#D9B45A","options":["#D9B45A","#E8A3A3","#9FC9B0"]},"$preview":{"width":1280,"height":2600}}'>
class Component extends DCLogic {
  renderVals() {
    const courses = [
      { kind: '식전', name: '30분 무료 상담', desc: '무엇을 만들지, 만들 수 있는지부터 솔직하게.', price: '무료' },
      { kind: '전채', name: '기획 한 접시', desc: '첫 출시에 꼭 필요한 화면만 골라 한 장으로 정리합니다.', price: '[가격]' },
      { kind: '메인', name: '디자인과 개발', desc: '눌러보는 시안, 그리고 매주 금요일 테스트 링크.', price: '[가격]' },
      { kind: '디저트', name: '출시', desc: '스토어 심사와 서버 설정까지 깔끔하게 마무리합니다.', price: '[가격]' },
      { kind: '커피', name: '유지보수', desc: '출시 뒤에도 오류를 고치고 다음 기능을 함께 고민합니다.', price: '[월 단위 가격]' }
    ];
    return {
      accent: this.props.accent ?? '#D9B45A',
      courses: courses.map((c, i) => ({ ...c, delay: (i * 90) + 'ms' }))
    };
  }
}
</script>
<script src="../dc-lite.js"></script>
</body>
</html>
